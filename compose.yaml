services:
  app:
    build: docker/php
    tty: true
    volumes:
      - .:/var/www/app
    depends_on:
      database:
        condition: service_healthy

  # Worker that fires scheduled messages (quiz questions twice a day).
  scheduler:
    build: docker/php
    command: php bin/console messenger:consume scheduler_quiz -vv --time-limit=3600
    restart: unless-stopped
    volumes:
      - .:/var/www/app
    depends_on:
      database:
        condition: service_healthy

  # Worker that processes the async queue — outgoing emails are routed here
  # (see routing: SendEmailMessage in config/packages/messenger.yaml).
  worker:
    build: docker/php
    command: php bin/console messenger:consume async failed -vv --time-limit=3600
    restart: unless-stopped
    volumes:
      - .:/var/www/app
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
